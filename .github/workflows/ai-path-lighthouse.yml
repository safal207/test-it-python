name: AI PATH Lighthouse and accessibility budgets

on:
  workflow_call:
  pull_request:
    paths:
      - "dist/ai-path/**"
      - "scripts/verify-ai-path.mjs"
      - "scripts/build-neural-courses.mjs"
      - "package.json"
      - "lighthouserc.cjs"
      - "lighthouserc.mobile.cjs"
      - ".github/workflows/ai-path-lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check project JavaScript
        run: npm run check
      - name: Install pinned Lighthouse CI runner
        run: npm install --no-save --no-audit --no-fund @lhci/cli@0.15.1
      - name: Audit school pages with required quality budgets
        run: |
          if [ "${{ matrix.profile }}" = mobile ]; then
            npm run test:lighthouse:mobile
          else
            npm run test:lighthouse
          fi
      - name: Archive Lighthouse reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-path-lighthouse-${{ matrix.profile }}-reports
          path: |
            .lighthouseci/
            artifacts/lighthouse/
            artifacts/lighthouse-mobile/
          if-no-files-found: warn
          retention-days: 21
