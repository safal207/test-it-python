name: Publish Test it

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  browser-acceptance:
    uses: ./.github/workflows/ai-path-smoke.yml

  lighthouse:
    uses: ./.github/workflows/ai-path-lighthouse.yml

  deploy:
    needs: [browser-acceptance, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Python for social preview rendering
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Render AI PATH social image
        run: |
          python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2'
          python -c "import cairosvg; cairosvg.svg2png(url='dist/ai-path/assets/social-preview.svg', write_to='dist/ai-path/assets/social-preview.png', output_width=1200, output_height=630)"
          python -c "import os; p='dist/ai-path/assets/social-preview.png'; assert os.path.getsize(p) > 10000"
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
