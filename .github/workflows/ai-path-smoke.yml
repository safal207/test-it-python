name: AI PATH interactive smoke

on:
  workflow_call:
  pull_request:
    paths:
      - "dist/ai-path/**"
      - "scripts/verify-ai-path.mjs"
      - "scripts/verify-plan-to-space.mjs"
      - "scripts/verify-ai-desk.mjs"
      - "scripts/build-neural-courses.mjs"
      - "package.json"
      - ".github/workflows/ai-path-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Install PDF acceptance parser
        run: python -m pip install --disable-pip-version-check pypdf==6.1.3
      - name: Check application and acceptance script syntax
        run: |
          node --check dist/ai-path/app.js
          node --check dist/ai-path/plan-pdf.js
          node --check scripts/verify-ai-path.mjs
          node --check scripts/verify-plan-to-space.mjs
          node --check scripts/verify-ai-desk.mjs
      - name: Verify AI Desk 3D configuration, responsive controls and recovery
        run: node scripts/verify-ai-desk.mjs
      - name: Verify Plan to Space scroll scene and accessible controls
        run: node scripts/verify-plan-to-space.mjs
      - name: Verify site with real browser interactions at desktop and mobile
        run: node scripts/verify-ai-path.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-path-responsive-previews
          path: |
            artifacts/ai-path-qa/
            artifacts/ai-desk-qa/
          if-no-files-found: warn
          retention-days: 14
