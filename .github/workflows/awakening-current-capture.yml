name: Capture advanced Awakening gameplay
on:
  push:
    branches: [ci/awakening-capture-20261019]
permissions:
  contents: read
concurrency:
  group: awakening-capture-20261019
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      SOURCE_SHA: e7d816954daf4341710bfc554ca27d49a754a20b
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install desktop capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth imagemagick xdotool mesa-utils libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 libxcursor1 libxi6
      - name: Build the exact advanced source and its existing capture harness
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/safal207/Awakening.git "$RUNNER_TEMP/awakening"
          git -C "$RUNNER_TEMP/awakening" checkout "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/awakening" rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          git -C "$RUNNER_TEMP/awakening" status --porcelain > "$GITHUB_WORKSPACE/evidence/source-status-before.txt"
          dotnet build "$RUNNER_TEMP/awakening/tests/GraphicsSmoke/GraphicsSmoke.csproj" --configuration Release > "$GITHUB_WORKSPACE/evidence/build.log" 2>&1
          dotnet --info > "$GITHUB_WORKSPACE/evidence/dotnet-info.txt"
      - name: Run the unmodified native OpenGL screenshot harness
        run: |
          export EVIDENCE_DIR="$GITHUB_WORKSPACE/evidence"
          set +e
          timeout 240s xvfb-run -a -s '-screen 0 1920x1200x24 +extension GLX +render -noreset' bash <<'SH'
          set -euo pipefail
          cd "$RUNNER_TEMP/awakening"
          glxinfo -B > "$EVIDENCE_DIR/glxinfo.txt"
          dotnet run --project tests/GraphicsSmoke/GraphicsSmoke.csproj --configuration Release --no-build > "$EVIDENCE_DIR/graphics-smoke.log" 2>&1
          SH
          result=$?
          find "$RUNNER_TEMP/awakening/artifacts/manhattan-refresh" -maxdepth 1 -type f \( -name '*.png' -o -name '*.json' \) -exec cp {} "$EVIDENCE_DIR/" \;
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$EVIDENCE_DIR/captured-at.txt"
          git -C "$RUNNER_TEMP/awakening" status --porcelain > "$EVIDENCE_DIR/source-status-after.txt"
          exit "$result"
      - name: Record provenance and unchanged PNG checksums
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'evidence'
          root.mkdir(exist_ok=True)
          files=[]
          for p in sorted(root.glob('*.png')):
              files.append({'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'capture':'Existing unmodified tests/GraphicsSmoke/VisualProbe.cs.txt, real OpenGL framebuffer PNG'})
          data={'repository':'safal207/Awakening','sourceCommit':os.environ['SOURCE_SHA'],'sourceRef':'codex/awakening-concept-visuals (unmerged development branch, PR15)','workflowCommit':os.environ['GITHUB_SHA'],'workflowRun':os.environ['GITHUB_RUN_ID'],'runtime':'Unmodified .NET8/OpenTK game and GraphicsSmoke harness under Xvfb/Mesa software OpenGL','mode':'existing scripted scene/camera/time values; not a story playthrough or performance benchmark','capturedAt':(root/'captured-at.txt').read_text().strip() if (root/'captured-at.txt').exists() else None,'files':files}
          (root/'provenance.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: awakening-advanced-native-e7d8169
          path: evidence/
          if-no-files-found: error
          retention-days: 14
