<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test it · Учебный магазин</title><style>body{font:18px/1.6 system-ui;background:#f5f7fb;color:#172b47;max-width:800px;margin:40px auto;padding:20px}article,section{background:white;border:1px solid #dce3ec;border-radius:16px;padding:24px;margin:18px 0}button{font:inherit;background:#172b47;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5}input{font:inherit;width:90px;padding:8px}label{display:block;margin:12px 0}h1,h2{line-height:1.3}output{display:block;font-weight:bold;margin:20px 0}</style></head><body>
<h1>Учебный магазин</h1><p>Локальный полигон для API- и UI-тестов. Деньги не списываются.</p>
<article aria-label="Python Book"><h2>Python Book</h2><p>1 500 ₽</p><button type="button" id="add">В корзину</button></article>
<section aria-label="Корзина"><h2>Корзина</h2><p id="empty">Корзина пуста</p><div id="cart" hidden><p>Python Book</p><label>Количество <input id="quantity" type="number" min="1" max="99" value="1"></label><p id="total" aria-label="Итого">1 500 ₽</p><button id="order" type="button">Оформить заказ</button></div></section>
<p role="status" id="status" aria-live="polite"></p>
<script>
const quantity=document.querySelector('#quantity'),status=document.querySelector('#status');
document.querySelector('#add').onclick=()=>{document.querySelector('#empty').hidden=true;document.querySelector('#cart').hidden=false;status.textContent='Товар добавлен';};
quantity.oninput=()=>{document.querySelector('#total').textContent=(1500*Number(quantity.value)).toLocaleString('ru-RU')+' ₽';};
document.querySelector('#order').onclick=async()=>{
 const button=document.querySelector('#order');button.disabled=true;status.textContent='Создаём заказ…';
 try{const response=await fetch('/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:[{product_id:1,quantity:Number(quantity.value)}]})});const body=await response.json();status.textContent=response.ok?'Заказ создан: '+body.id:'Ошибка: проверь количество товаров';}
 catch{status.textContent='Сервер недоступен';}finally{button.disabled=false;}
};
</script></body></html>
