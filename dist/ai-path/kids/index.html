lse's text instead"]],"correct":1,"why":["Паузы, ясные слова и практика помогают слушателю.","Pauses, clear words and practice help the listener."]}]},{"id":"logic","icon":"✦","color":"#7856cc","title":["Логика и числа","Logic & numbers"],"desc":["Найди закономерность","Find the pattern"],"questions":[{"q":["Какое число следующее: 2, 4, 6, …?","Which number comes next: 2, 4, 6, …?"],"a":[["7","7"],["8","8"],["10","10"]],"correct":1,"why":["Каждый раз прибавляем 2.","Add 2 each time."]},{"q":["У тебя 12 яблок. Ты отдал 5. Сколько осталось?","You have 12 apples and give away 5. How many remain?"],"a":[["7","7"],["5","5"],["8","8"]],"correct":0,"why":["12 − 5 = 7.","12 − 5 = 7."]},{"q":["Что продолжает ряд: ★ ● ★ ● …?","What continues the pattern: ★ ● ★ ● …?"],"a":[["●","●"],["▲","▲"],["★","★"]],"correct":2,"why":["Звезда и круг чередуются.","Stars and circles alternate."]}]},{"id":"english","icon":"A","color":"#007c85","title":["Английский","English"],"desc":["Три слова для приключения","Three words for an adventure"],"questions":[{"q":["Как по-английски «яблоко»?","Which word means the fruit 🍎?"],"a":[["book","book"],["apple","apple"],["water","water"]],"correct":1,"why":["Apple — яблоко.","An apple is a fruit."]},{"q":["Как сказать «спасибо»?","Which phrase shows gratitude?"],"a":[["Thank you","Thank you"],["Good night","Good night"],["See you","See you"]],"correct":0,"why":["Thank you — спасибо.","Say “Thank you” when someone helps you."]},{"q":["Выбери слово «книга».","Choose the word for 📚."],"a":[["door","door"],["cat","cat"],["book","book"]],"correct":2,"why":["Book — книга.","A book has pages to read."]}]},{"id":"code","icon":"{ }","color":"#be641a","title":["Код и алгоритмы","Code & algorithms"],"desc":["Научи робота действовать","Teach a robot to act"],"questions":[{"q":["Робот стоит в клетке 1. Сделай два шага вправо. Где робот?","A robot starts on square 1 and moves two squares right. Where is it?"],"a":[["2","2"],["3","3"],["4","4"]],"correct":1,"why":["1 + 2 = 3.","1 + 2 = 3."]},{"q":["Что означает команда «повтори 3 раза»?","What does “repeat 3 times” mean?"],"a":[["Выполнить действие трижды","Do the action three times"],["Пропустить действие","Skip the action"],["Остановить робота","Stop the robot"]],"correct":0,"why":["Цикл повторяет действие указанное число раз.","A loop repeats an action the specified number of times."]},{"q":["Робот должен остановиться у стены. Какое правило нужно?","The robot should stop at a wall. Which rule works?"],"a":[["Всегда иди вперёд","Always go forward"],["Прыгай без остановки","Keep jumping"],["Если стена — остановись","If there is a wall, stop"]],"correct":2,"why":["Условие помогает программе выбирать действие.","A condition helps a program choose an action."]}]}];
const ids=lessons.map(l=>l.id);
function normalize(raw,ids){return {lang:raw?.lang==="en"?"en":"ru",done:Array.isArray(raw?.done)?[...new Set(raw.done.filter(x=>ids.includes(x)))]:[]}}
function finish(state,id,ids){const clean=normalize(state,ids);if(ids.includes(id)&&!clean.done.includes(id))clean.done.push(id);return clean}
function xp(state){return state.done.length*30}

 xpLabel:["Опыт XP","XP earned"],doneLabel:["Миссии","Missions"],pathTitle:["Твой путь","Your path"],pathNote:["Все задания открыты бесплатно. Ошибки помогают учиться.","All missions are free. Mistakes help you learn."],
 done:["Повторить","Review"],start:["Играть","Play"],back:["← На карту","← Back to map"],next:["Далее","Continue"],finish:["Завершить","Finish"],tryAgain:["Попробуй ещё раз. ","Try again. "],correct:["Верно! ","Correct! "],congrats:["Миссия выполнена!","Mission complete!"],earned:["Ты получил 30 XP за новую миссию.","You earned 30 XP for a new mission."],reviewed:["Ты закрепил знания. Опыт за эту миссию уже начислен.","You strengthened your skills. XP was already earned for this mission."],return:["На карту навыков","Back to skill map"],parentTitle:["Раздел для родителей","For parents"],parentInfo:["Базовые миссии бесплатны. Планируем дополнительные программы по желанию родителей.","Core missions are free. Optional extensions are planned for parents."],privacy:["Прогресс и черновик книги хранятся только в этом браузере. Нет аккаунтов, аналитики, рекламы, чатов или оплаты.","Progress and the book draft stay in this browser. No accounts, analytics, ads, chats or payments."],reset:["Сбросить локальный прогресс","Reset local progress"],confirm:["Сбросить все выполненные миссии и черновик книги на этом устройстве?","Reset all completed missions and the book draft on this device?"],prototype:["Демонстрационный прототип: 19 вопросов, 5 миссий и мастерская книги. Дополнительные программы пока не доступны.","Prototype: 19 questions, 5 missions and a book workshop. Optional programs are not yet available."],storage:["Прогресс не удалось сохранить. Он доступен до закрытия страницы.","Progress could not be saved. It lasts until this page is closed."]
};
const $=id=>document.getElementById(id);
const tr=pair=>pair[state.lang==="en"?1:0];
const t=id=>tr(copy[id]);
let active=null,index=0,solved=false,lastEarned=false,feedbackKey=null;
function save(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{return false}}
function show(id){for(const k of ["home","play","complete"])$(k).hidden=k!==id;$("parents").hidden=id!=="home"}
function renderHome(){document.documentElement.lang=state.lang;$("lang").textContent=state.lang==="ru"?"EN":"RU";for(const id of ["eyebrow","headline","subtitle","xpLabel","doneLabel","pathTitle","pathNote","parentTitle","parentInfo","privacy","reset","prototype"])$(id).textContent=t(id);$("xp").textContent=xp(state);$("done").textContent=state.done.length+" / "+lessons.length;$("path").replaceChildren();for(const lesson of lessons){const btn=document.createElement("button");btn.type="button";btn.className="lesson";const symbol=document.createElement("span");symbol.className="symbol";symbol.style.setProperty("--card-color",lesson.color);symbol.textContent=lesson.icon;symbol.setAttribute("aria-hidden","true");const body=document.createElement("span"),name=document.createElement("strong"),desc=document.createElement("small");name.textContent=tr(lesson.title);desc.textContent=tr(lesson.desc);body.append(name,desc);const label=document.createElement("span");label.className="state";label.textContent=state.done.includes(lesson.id)?t("done"):t("start");btn.append(symbol,body,label);btn.onclick=()=>start(lesson);$("path").append(btn)}renderWorkshop();$("offers").replaceChildren();for(const offer of [[["Клуб создания игр","Game creation club"],["Проекты и помощь наставника · планируется","Projects and mentor support · planned"]],[["3D и творческая лаборатория","3D and creativity lab"],["Дополнительные творческие занятия · планируется","Extra creative sessions · planned"]],[["Семейные отчёты","Family learning reports"],["Расширенные отчёты без ограничения базовых уроков · планируется","Expanded reports without restricting core lessons · planned"]]]){const row=document.createElement("div");row.className="offer";const title=document.createElement("strong"),desc=document.createElement("small");title.textContent=tr(offer[0]);desc.textContent=tr(offer[1]);row.append(title,desc);$("offers").append(row)}}
function start(lesson){active=lesson;index=0;solved=false;feedbackKey=null;show("play");renderQuestion(true)}
function renderQuestion(focus=false){const q=active.questions[index];$("back").textContent=t("back");$("course").textContent=tr(active.title);$("question").textContent=tr(q.q);$("step").textContent=(index+1)+" / "+active.questions.length;const progress=document.querySelector(".track");progress.setAttribute("aria-label",state.lang==="en"?"Lesson progress":"Прогресс урока");progress.setAttribute("aria-valuemax",String(active.questions.length));progress.setAttribute("aria-valuenow",String(index+(solved?1:0)));$("fill").style.width=(index+(solved?1:0))/active.questions.length*100+"%";$("answers").replaceChildren();q.a.forEach((a,i)=>{const btn=document.createElement("button");btn.type="button";btn.className="choice";btn.textContent=tr(a);btn.disabled=solved;if(solved&&i===q.correct)btn.classList.add("correct");btn.onclick=()=>{if(solved)return;if(i===q.correct){solved=true;feedbackKey="correct";renderQuestion();$("next").focus()}else{feedbackKey="tryAgain";btn.classList.add("retry");$("feedback").textContent=t("tryAgain")+tr(q.why)}};$("answers").append(btn)});$("feedback").textContent=feedbackKey?t(feedbackKey)+tr(q.why):"";$("next").textContent=index===active.questions.length-1?t("finish"):t("next");$("next").disabled=!solved;if(focus)$("question").focus()}

function readDraft(){draft=cleanDraft({title:$("bookTitle").value,story:$("story").value,pitch:$("pitch").value,rehearsed:$("rehearsed").checked})}
function saveDraft(){try{localStorage.setItem(draftKey,JSON.stringify(draft));return true}catch{return false}}
function renderWorkshop(){for(const id of ["workTitle","workIntro","titleLabel","storyLabel","pitchLabel","speechGuide","rehearsedLabel","saveBook","exportBook"])$(id).textContent=wt(id);$("bookTitle").value=draft.title;$("story").value=draft.story;$("pitch").value=draft.pitch;$("rehearsed").checked=draft.rehearsed;$("bookStatus").textContent=""}
for(const id of ["bookTitle","story","pitch","rehearsed"])$(id).addEventListener("input",readDraft);
$("saveBook").onclick=()=>{readDraft();$("bookStatus").textContent=wt(saveDraft()?"saved":"unsaved")};
$("exportBook").onclick=()=>{readDraft();if(!draft.title.trim()||!draft.story.trim()){$("bookStatus").textContent=wt("needStory");return}const text=[draft.title,draft.story,draft.pitch].join("\n\n");const url=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="my-book.txt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
renderHome();show("home");
</script></body></html>
