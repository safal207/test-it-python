<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light"><title>AI PATH Kids — prototype</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#1b2438;background:#f5f5f0;--ink:#1b2438;--muted:#596477;--accent:#275e40}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #1768bc;outline-offset:3px}button:disabled{cursor:default;opacity:.65}header{background:white;border-bottom:1px solid #dcded7}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}.brand{font-size:1.15rem;font-weight:900;letter-spacing:-.04em}.wrap{max-width:780px;margin:auto;padding:16px}.lang{border:1px solid #aab3aa;border-radius:12px;padding:9px 12px;background:white;color:var(--ink);font-weight:700;min-height:44px}.hero{background:#e0efd8;padding:22px;border:1px solid #d0e2c7;border-radius:24px;margin:6px 0 18px}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#315c3f}h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.12;letter-spacing:-.05em;margin:10px 0}h2{font-size:1.25rem;margin:16px 0 8px}p{margin:6px 0 12px}small,.muted{color:var(--muted)}.stats{display:flex;flex-wrap:wrap;gap:12px}.stat{background:white;border-radius:16px;padding:12px 16px;flex:1;min-width:110px}.stat strong{font-size:1.4rem;display:block}.path{display:grid;gap:12px}.lesson{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:white;border:1px solid #d7dad4;border-radius:20px;padding:16px;min-height:90px;color:var(--ink);box-shadow:0 3px 0 #e0e3dc}.lesson .symbol{display:grid;place-items:center;background:var(--card-color);color:white;font-weight:900;font-size:1.3rem;width:56px;height:56px;border-radius:16px;flex-shrink:0}.lesson strong,.lesson small{display:block}.lesson .state{margin-left:auto;color:#275e40;font-weight:800;font-size:.8rem;text-align:right}.panel{background:white;border:1px solid #d7dad4;padding:20px;border-radius:20px;margin-top:12px}.primary{width:100%;border:0;border-radius:14px;padding:14px 16px;min-height:48px;background:#275e40;color:white;font-weight:800}.secondary{background:white;color:var(--ink);border:1px solid #aab3aa;border-radius:12px;min-height:44px;padding:10px 14px}.choice{background:#f7f8f3;border:2px solid #d7dad4;border-radius:14px;padding:14px;text-align:left;width:100%;color:var(--ink);min-height:52px;font-weight:700}.choice.correct{border-color:#247b45;background:#e6f5e8}.choice.retry{border-color:#ac671c;background:#fff3e3}.answers{display:grid;gap:10px;margin:18px 0}.feedback{min-height:54px;color:#34473e}.track{height:12px;border-radius:99px;background:#e3e6df;overflow:hidden;margin:10px 0 16px}.fill{height:100%;background:#38824d;border-radius:99px}.parents{margin:22px 0 12px;background:white;border:1px solid #d7dad4;border-radius:18px;padding:16px}.parents summary{cursor:pointer;font-weight:800;min-height:36px}.offer{padding:10px 0;border-top:1px solid #e1e4de}.offer strong{display:block}.notice{font-size:.8rem;color:#596477}.pill{font-size:.78rem;background:#e7eee4;border-radius:99px;padding:4px 9px;display:inline-block}.back{margin-bottom:8px}.panel[hidden],section[hidden]{display:none!important}@media(max-width:350px){.wrap{padding:12px}.hero,.panel{padding:16px}.lesson{padding:12px;gap:9px}.lesson .symbol{width:42px;height:42px}}
</style></head>
<body><header><div class="wrap"><span class="brand">AI PATH <span style="color:#275e40">KIDS</span></span><button class="lang" id="lang" type="button" aria-label="Switch language">EN</button></div></header>
<main class="wrap"><section id="home"><div class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1><p id="subtitle"></p><div class="stats"><div class="stat"><small id="xpLabel"></small><strong id="xp"></strong></div><div class="stat"><small id="doneLabel"></small><strong id="done"></strong></div></div></div><h2 id="pathTitle"></h2><p class="muted" id="pathNote"></p><div class="path" id="path"></div></section>
<section id="play" hidden><button type="button" class="secondary back" id="back"></button><div class="panel"><span id="course" class="pill"></span><h2 id="question" tabindex="-1"></h2><small id="step"></small><div class="track" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><div class="fill" id="fill"></div></div><div class="answers" id="answers"></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><button type="button" class="primary" id="next" disabled></button></div></section>
<section id="complete" hidden><div class="panel"><h1 id="congrats" tabindex="-1"></h1><p id="reward"></p><button type="button" class="primary" id="return"></button></div></section>
<details class="parents" id="parents"><summary id="parentTitle"></summary><p id="parentInfo"></p><div id="offers"></div><p class="notice" id="privacy"></p><button type="button" class="secondary" id="reset"></button></details><p class="notice" id="prototype"></p></main>
<script type="module">
const lessons=[{"id":"logic","icon":"✦","color":"#7856cc","title":["Логика и числа","Logic & numbers"],"desc":["Найди закономерность","Find the pattern"],"questions":[{"q":["Какое число следующее: 2, 4, 6, …?","Which number comes next: 2, 4, 6, …?"],"a":[["7","7"],["8","8"],["10","10"]],"correct":1,"why":["Каждый раз прибавляем 2.","Add 2 each time."]},{"q":["У тебя 12 яблок. Ты отдал 5. Сколько осталось?","You have 12 apples and give away 5. How many remain?"],"a":[["7","7"],["5","5"],["8","8"]],"correct":0,"why":["12 − 5 = 7.","12 − 5 = 7."]},{"q":["Что продолжает ряд: ★ ● ★ ● …?","What continues the pattern: ★ ● ★ ● …?"],"a":[["●","●"],["▲","▲"],["★","★"]],"correct":2,"why":["Звезда и круг чередуются.","Stars and circles alternate."]}]},{"id":"english","icon":"A","color":"#007c85","title":["Английский","English"],"desc":["Три слова для приключения","Three words for an adventure"],"questions":[{"q":["Как по-английски «яблоко»?","Which word means the fruit 🍎?"],"a":[["book","book"],["apple","apple"],["water","water"]],"correct":1,"why":["Apple — яблоко.","An apple is a fruit."]},{"q":["Как сказать «спасибо»?","Which phrase shows gratitude?"],"a":[["Thank you","Thank you"],["Good night","Good night"],["See you","See you"]],"correct":0,"why":["Thank you — спасибо.","Say “Thank you” when someone helps you."]},{"q":["Выбери слово «книга».","Choose the word for 📚."],"a":[["door","door"],["cat","cat"],["book","book"]],"correct":2,"why":["Book — книга.","A book has pages to read."]}]},{"id":"code","icon":"{ }","color":"#be641a","title":["Код и алгоритмы","Code & algorithms"],"desc":["Научи робота действовать","Teach a robot to act"],"questions":[{"q":["Робот стоит в клетке 1. Сделай два шага вправо. Где робот?","A robot starts on square 1 and moves two squares right. Where is it?"],"a":[["2","2"],["3","3"],["4","4"]],"correct":1,"why":["1 + 2 = 3.","1 + 2 = 3."]},{"q":["Что означает команда «повтори 3 раза»?","What does “repeat 3 times” mean?"],"a":[["Выполнить действие трижды","Do the action three times"],["Пропустить действие","Skip the action"],["Остановить робота","Stop the robot"]],"correct":0,"why":["Цикл повторяет действие указанное число раз.","A loop repeats an action the specified number of times."]},{"q":["Робот должен остановиться у стены. Какое правило нужно?","The robot should stop at a wall. Which rule works?"],"a":[["Всегда иди вперёд","Always go forward"],["Прыгай без остановки","Keep jumping"],["Если стена — остановись","If there is a wall, stop"]],"correct":2,"why":["Условие помогает программе выбирать действие.","A condition helps a program choose an action."]}]}];
const ids=lessons.map(l=>l.id);
function normalize(raw,ids){return {lang:raw?.lang==="en"?"en":"ru",done:Array.isArray(raw?.done)?[...new Set(raw.done.filter(x=>ids.includes(x)))]:[]}}
function finish(state,id,ids){const clean=normalize(state,ids);if(ids.includes(id)&&!clean.done.includes(id))clean.done.push(id);return clean}
function xp(state){return state.done.length*30}
const key="ai-path-kids-prototype-v1";
let state;try{state=normalize(JSON.parse(localStorage.getItem(key)),ids)}catch{state=normalize(null,ids)}
const copy={
 eyebrow:["Бесплатная школа · 7–12 лет","Free school · ages 7–12"],
 headline:["Открой свои способности","Discover your super skills"],
 subtitle:["Три короткие миссии. Играй, учись и открывай следующий навык в своём темпе.","Three short missions. Play, learn and discover new skills at your own pace."],
 xpLabel:["Опыт XP","XP earned"],doneLabel:["Миссии","Missions"],pathTitle:["Твой путь","Your path"],pathNote:["Все задания открыты бесплатно. Ошибки помогают учиться.","All missions are free. Mistakes help you learn."],
 done:["Повторить","Review"],start:["Играть","Play"],back:["← На карту","← Back to map"],next:["Далее","Continue"],finish:["Завершить","Finish"],tryAgain:["Попробуй ещё раз. ","Try again. "],correct:["Верно! ","Correct! "],congrats:["Миссия выполнена!","Mission complete!"],earned:["Ты получил 30 XP за новую миссию.","You earned 30 XP for a new mission."],reviewed:["Ты закрепил знания. Опыт за эту миссию уже начислен.","You strengthened your skills. XP was already earned for this mission."],return:["На карту навыков","Back to skill map"],parentTitle:["Раздел для родителей","For parents"],parentInfo:["Базовые миссии бесплатны. Планируем дополнительные программы по желанию родителей.","Core missions are free. Optional extensions are planned for parents."],privacy:["Прогресс хранится только в этом браузере. Нет аккаунтов, аналитики, рекламы, чатов или оплаты.","Progress stays in this browser. No accounts, analytics, ads, chats or payments."],reset:["Сбросить локальный прогресс","Reset local progress"],confirm:["Сбросить все выполненные миссии на этом устройстве?","Reset all completed missions on this device?"],prototype:["Демонстрационный прототип: 9 вопросов, 3 миссии. Дополнительные программы пока не доступны.","Prototype: 9 questions, 3 missions. Optional programs are not yet available."],storage:["Прогресс не удалось сохранить. Он доступен до закрытия страницы.","Progress could not be saved. It lasts until this page is closed."]
};
const $=id=>document.getElementById(id);
const tr=pair=>pair[state.lang==="en"?1:0];
const t=id=>tr(copy[id]);
let active=null,index=0,solved=false,lastEarned=false,feedbackKey=null;
function save(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{return false}}
function show(id){for(const k of ["home","play","complete"])$(k).hidden=k!==id;$("parents").hidden=id!=="home"}
function renderHome(){document.documentElement.lang=state.lang;$("lang").textContent=state.lang==="ru"?"EN":"RU";for(const id of ["eyebrow","headline","subtitle","xpLabel","doneLabel","pathTitle","pathNote","parentTitle","parentInfo","privacy","reset","prototype"])$(id).textContent=t(id);$("xp").textContent=xp(state);$("done").textContent=state.done.length+" / "+lessons.length;$("path").replaceChildren();for(const lesson of lessons){const btn=document.createElement("button");btn.type="button";btn.className="lesson";const symbol=document.createElement("span");symbol.className="symbol";symbol.style.setProperty("--card-color",lesson.color);symbol.textContent=lesson.icon;symbol.setAttribute("aria-hidden","true");const body=document.createElement("span"),name=document.createElement("strong"),desc=document.createElement("small");name.textContent=tr(lesson.title);desc.textContent=tr(lesson.desc);body.append(name,desc);const label=document.createElement("span");label.className="state";label.textContent=state.done.includes(lesson.id)?t("done"):t("start");btn.append(symbol,body,label);btn.onclick=()=>start(lesson);$("path").append(btn)}$("offers").replaceChildren();for(const offer of [[["Клуб создания игр","Game creation club"],["Проекты и помощь наставника · планируется","Projects and mentor support · planned"]],[["3D и творческая лаборатория","3D and creativity lab"],["Дополнительные творческие занятия · планируется","Extra creative sessions · planned"]],[["Семейные отчёты","Family learning reports"],["Расширенные отчёты без ограничения базовых уроков · планируется","Expanded reports without restricting core lessons · planned"]]]){const row=document.createElement("div");row.className="offer";const title=document.createElement("strong"),desc=document.createElement("small");title.textContent=tr(offer[0]);desc.textContent=tr(offer[1]);row.append(title,desc);$("offers").append(row)}}
function start(lesson){active=lesson;index=0;solved=false;feedbackKey=null;show("play");renderQuestion(true)}
function renderQuestion(focus=false){const q=active.questions[index];$("back").textContent=t("back");$("course").textContent=tr(active.title);$("question").textContent=tr(q.q);$("step").textContent=(index+1)+" / "+active.questions.length;const progress=document.querySelector(".track");progress.setAttribute("aria-label",state.lang==="en"?"Lesson progress":"Прогресс урока");progress.setAttribute("aria-valuenow",String(index+(solved?1:0)));$("fill").style.width=(index+(solved?1:0))/active.questions.length*100+"%";$("answers").replaceChildren();q.a.forEach((a,i)=>{const btn=document.createElement("button");btn.type="button";btn.className="choice";btn.textContent=tr(a);btn.disabled=solved;if(solved&&i===q.correct)btn.classList.add("correct");btn.onclick=()=>{if(solved)return;if(i===q.correct){solved=true;feedbackKey="correct";renderQuestion();$("next").focus()}else{feedbackKey="tryAgain";btn.classList.add("retry");$("feedback").textContent=t("tryAgain")+tr(q.why)}};$("answers").append(btn)});$("feedback").textContent=feedbackKey?t(feedbackKey)+tr(q.why):"";$("next").textContent=index===active.questions.length-1?t("finish"):t("next");$("next").disabled=!solved;if(focus)$("question").focus()}
function renderComplete(focus=false){$("congrats").textContent=t("congrats");$("reward").textContent=t(lastEarned?"earned":"reviewed");$("return").textContent=t("return");if(focus)$("congrats").focus()}
function home(){active=null;show("home");renderHome();$("path").querySelector("button")?.focus()}
$("next").onclick=()=>{if(!solved||!active)return;if(index+1<active.questions.length){index++;solved=false;feedbackKey=null;renderQuestion(true);return}lastEarned=!state.done.includes(active.id);state=finish(state,active.id,ids);const persisted=save();show("complete");renderComplete(true);if(!persisted)$("reward").textContent+=" "+t("storage")};
$("back").onclick=home;$("return").onclick=home;
$("lang").onclick=()=>{state.lang=state.lang==="ru"?"en":"ru";save();renderHome();if(!$("play").hidden)renderQuestion();if(!$("complete").hidden)renderComplete()};
$("reset").onclick=()=>{if(!confirm(t("confirm")))return;state.done=[];save();renderHome()};
renderHome();show("home");
</script></body></html>
