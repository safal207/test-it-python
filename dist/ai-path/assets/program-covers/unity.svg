<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Unity: схема первого 2D-прототипа</title><desc id="desc">Игрок, три кристалла и выход. Учебная схема планируемой игры, не снимок Unity.</desc><rect width="960" height="640" fill="#efe7fa"/><rect x="80" y="100" width="800" height="440" rx="32" fill="#24143b"/><path d="M150 430H295V310H510V205H730V350H805" fill="none" stroke="#9d87b9" stroke-width="5" stroke-dasharray="12 12"/><rect x="125" y="397" width="64" height="64" rx="18" fill="#b1e666"/><circle cx="146" cy="418" r="4" fill="#24143b"/><circle cx="169" cy="418" r="4" fill="#24143b"/><path d="m295 278 22 32-22 32-22-32zm215-105 22 32-22 32-22-32zm220 0 22 32-22 32-22-32z" fill="#55d6c7" stroke="#b5fff1" stroke-width="3"/><rect x="770" y="310" width="55" height="80" rx="8" fill="#ffc94a"/><circle cx="810" cy="351" r="4" fill="#24143b"/><text x="120" y="160" fill="#fff7ed" font-family="Arial,sans-serif" font-size="20" font-weight="700">PLAYER → 3 CRYSTALS → EXIT</text><text x="120" y="505" fill="#cfbfe3" font-family="Arial,sans-serif" font-size="18">MOVE · COLLECT · WIN · RESTART</text><text x="80" y="590" fill="#4a3165" font-family="Arial,sans-serif" font-size="18">УЧЕБНАЯ СХЕМА · ПЛАН ПЕРВОГО ПРОТОТИПА</text></svg>
